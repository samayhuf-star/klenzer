<!doctype html>
<html><head><meta charset="utf-8"><script src="ui.js"></script>
<style id="css"></style>
<style>
html,body{width:1320px;height:2868px;overflow:hidden}
.canvas{position:relative;width:1320px;height:2868px;overflow:hidden;font-family:Inter}
.blob{position:absolute;border-radius:50%;filter:blur(90px)}
.head{position:absolute;left:0;right:0;top:150px;text-align:center;padding:0 90px;z-index:2}
.pill{display:inline-flex;align-items:center;gap:14px;padding:16px 34px;border-radius:999px;font-weight:800;font-size:36px;letter-spacing:4px;margin-bottom:40px}
.h1{font-family:Fraunces;font-weight:900;font-size:128px;line-height:1.02;letter-spacing:-3px}
.h2{font-weight:500;font-size:48px;line-height:1.3;margin-top:34px}
.ph{position:absolute;left:50%;transform:translateX(-50%);z-index:1}
.chip{position:absolute;z-index:3;background:#fff;border-radius:40px;padding:26px 34px;display:flex;align-items:center;gap:22px;box-shadow:0 30px 60px rgba(11,16,48,.18);font-weight:700;font-size:40px;color:#0B1020}
.chip small{display:block;font-weight:500;font-size:28px;color:#8A93AD;margin-top:4px}
.chipIc{width:84px;height:84px;border-radius:24px;display:flex;align-items:center;justify-content:center}
</style></head>
<body><div id="root"></div>
<script>
const SHOTS = {
  home: { dark: false, pill: 'NEW ON THE APP STORE', h1: 'Free up space<br>in seconds', h2: 'Duplicates, screenshots and big videos,<br>found for you.', screen: () => home({}),
    chips: [{ x: 40, y: 1330, ic: 'leaf', tone: '#0BAE86', soft: C.mintSoft, t: '16.4 GB', s: 'found to review' }] },
  duplicates: { h1: 'Duplicates,<br>sorted for you', h2: 'Near-identical shots grouped.<br>The best one is kept.', screen: () => duplicates(),
    chips: [{ x: 790, y: 1730, ic: 'star', tone: '#0BAE86', soft: C.mintSoft, t: 'Best kept', s: 'You can change it' }] },
  screenshots: { h1: 'Clear out old<br>screenshots', h2: 'Biggest first. You pick what goes.', screen: () => screenshots(),
    chips: [{ x: 60, y: 2150, ic: 'phone-portrait', tone: C.violet, soft: C.violetSoft, t: '1,286', s: 'screenshots found' }] },
  videos: { h1: 'Spot the<br>giant videos', h2: 'Every video over 100 MB, sorted by size.', screen: () => videos(),
    chips: [{ x: 700, y: 2420, ic: 'videocam', tone: C.amber, soft: C.amberSoft, t: '1.4 GB', s: 'just one video' }] },
  done: { dark: true, h1: 'Clean up<br>in one tap', h2: 'Duplicates and temporary files,<br>cleared together.', screen: () => done(),
    chips: [] },
  privacy: { h1: 'Private by<br>design', h2: 'Everything stays on your iPhone.<br>No account, no ads, no tracking.', screen: () => onboardingPrivacy(),
    chips: [{ x: 70, y: 2260, ic: 'cloud-offline', tone: C.violet, soft: C.violetSoft, t: 'Never uploaded', s: '100% on-device' }] },
};
(async () => {
  GLYPHS = await (await fetch('Ionicons.json')).json();
  document.getElementById('css').textContent = SCREEN_CSS;
  const key = new URLSearchParams(location.search).get('s') || 'home';
  const S = SHOTS[key];
  const dark = !!S.dark;
  const bg = dark ? 'linear-gradient(180deg,#0B1020 0%,#14286B 100%)' : 'linear-gradient(180deg,#EEF3FF 0%,#F6F8FC 55%,#E9FBF5 100%)';
  const blobs = dark
    ? `<div class="blob" style="width:900px;height:900px;left:-300px;top:-200px;background:#2F6BFF;opacity:.45"></div><div class="blob" style="width:800px;height:800px;right:-300px;bottom:200px;background:#19E3B1;opacity:.25"></div>`
    : `<div class="blob" style="width:900px;height:900px;left:-350px;top:-250px;background:#9DB8FF;opacity:.55"></div><div class="blob" style="width:800px;height:800px;right:-320px;top:900px;background:#8FF0D6;opacity:.45"></div>`;
  const ink = dark ? '#fff' : C.ink, ink2 = dark ? '#B6C3EA' : C.ink2;
  const pill = S.pill ? `<div class="pill" style="background:${dark ? 'rgba(25,227,177,.16)' : '#0B1020'};color:${dark ? C.mint : '#fff'}">${icon('sparkles', 38, C.mint)}${S.pill}</div><br>` : '';
  document.getElementById('root').innerHTML = `<div class="canvas" style="background:${bg}">${blobs}
    <div class="head">${pill}<div class="h1" style="color:${ink}">${S.h1}</div><div class="h2" style="color:${ink2}">${S.h2}</div></div>
    <div class="ph" style="top:${S.pill ? 880 : 800}px">${phone(S.screen(), 920)}</div>
    ${S.chips.map((c) => `<div class="chip" style="left:${c.x}px;top:${c.y}px"><div class="chipIc" style="background:${c.soft}">${icon(c.ic, 46, c.tone)}</div><div>${c.t}<small>${c.s}</small></div></div>`).join('')}
  </div>`;
  await document.fonts.ready;
  document.body.dataset.ready = '1';
})();
</script></body></html>
