# Prices only resolve on a simulator when a StoreKit Configuration is attached
# (xcodebuild -storeKitConfigurationPath). Bare `maestro test` will not see them.
appId: com.krosz.klenzer
---
- tapOn:
    id: "open-paywall"
- extendedWaitUntil:
    visible:
      id: "paywall-screen"
    timeout: 8000
- assertVisible: "19.99"
- scrollUntilVisible:
    element:
      id: "plan-monthly"
    direction: DOWN
    timeout: 8000
- assertVisible: "3.99"
- scrollUntilVisible:
    element:
      id: "plan-lifetime"
    direction: DOWN
    timeout: 8000
- assertVisible: "29.99"
- assertVisible:
    id: "unlock"
- scrollUntilVisible:
    element: "Restore purchase"
    direction: DOWN
    timeout: 8000
- assertVisible: "Terms"
- assertVisible: "Privacy"
- assertVisible: "Support"
- takeScreenshot: 03-paywall
